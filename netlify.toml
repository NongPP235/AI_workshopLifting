[build]
  base = "static"
  publish = "."

# Version 2 performs analysis entirely in browser Web Workers.

[[headers]]
  for = "/runtime/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
